spring:
  application:
    name: multi-tenant-user-management-api
    profiles:
      active: postgres # Activates application-postgres.yml


server:
  port: 8081

logging:
  level:
    root: INFO
    com.example.multi_tenant_user_management_api: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/application.log

  logback:
    rollingpolicy:
      file-name-pattern: logs/archive/application-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html


