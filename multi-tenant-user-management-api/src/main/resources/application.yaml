spring:
  application:
    name: multi-tenant-user-management-api

  datasource:
    url: jdbc:mysql://localhost:3306/multi_tenant_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO

    # Your application
    com.example: DEBUG

    # Spring
    org.springframework: INFO
    org.springframework.web: INFO

    # Hibernate / JPA
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html